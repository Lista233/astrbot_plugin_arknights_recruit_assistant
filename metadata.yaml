name: astrbot_plugin_arknights_recruit_assistant
display_name: 明日方舟公开招募助手
short_desc: 明日方舟公招词条分析：识别截图或手动输入的词条，枚举 1~3 词条组合并按 6★/5★/4★ 优先级推荐
desc: >
  发送明日方舟公开招募界面截图（或直接输入词条），插件会识别 5 个词条，
  枚举其中 1~3 个词条的全部组合，按「高级资深干员必出6★ → 资深干员必出5★ →
  保底4★+极小概率5★ → 保底4★ → 小概率5★ → 小概率4★」的优先级给出推荐，
  并把每个组合的候选干员按星级分组全部列出，选中高资时额外标出攻略推荐的优先抓取干员
  （不再只给一个，而是列出全部可用组合并按出率排序）。
  支持由多模态模型读图（当前对话模型、配置里指定的模型 ID，
  也可以单独填一条自定义识图接口的地址 / 模型 / 秘钥，不走 bot 里的配置），
  全部干员数据由 Wiki 快照离线生成。
  支持一次传多张截图（分条发送也可以），多张并发识别后以合并转发发送结果
  （仅 OneBot 系平台，QQ 官方机器人等会自动改用普通文本）。
  只勾中「高级资深干员」/「资深干员」时，整池名单会单独成一条消息。
version: 1.0.2
author: Lista
repo: https://github.com/Lista233/astrbot_plugin_arknights_recruit_assistant
astrbot_version: ">=4.0.0"
support_platforms:
  - aiocqhttp
  - qq_official
  - qq_official_webhook
